name: Build Desktop & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Build Linux x86_64 Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils libarchive-tools zstd
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Bootstrap workspace
        run: pnpm bootstrap
        env:
          HUSKY: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Pin release version
        run: |
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version='3.14.3';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "pinned package.json version to $(node -p "require('./package.json').version")"

      - name: Bundle Desktop (Linux x64)
        run: pnpm bundle:desktop -- --os linux --arch x64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ZCODE_ENV: production

      - name: List build artifacts
        run: |
          echo "=== Built Linux Artifacts ==="
          ls -lh packages/desktop/dist/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zcode-linux-x64-artifacts
          path: |
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.pkg.tar.zst
          if-no-files-found: error

  build-mac-arm64:
    name: Build macOS arm64 DMG
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Bootstrap workspace
        run: pnpm bootstrap
        env:
          HUSKY: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Pin release version
        run: |
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version='3.14.3';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "pinned package.json version to $(node -p "require('./package.json').version")"

      - name: Bundle Desktop (macOS arm64)
        run: pnpm bundle:desktop -- --os mac --arch arm64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ZCODE_ENV: production

      - name: List build artifacts
        run: |
          echo "=== Built macOS arm64 Artifacts ==="
          ls -lh packages/desktop/dist/

      - name: Upload macOS arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: zcode-mac-arm64-artifacts
          path: packages/desktop/dist/*.dmg
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64 Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Bootstrap workspace
        run: pnpm bootstrap
        env:
          HUSKY: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Pin release version
        run: |
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version='3.14.3';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "pinned package.json version to $(node -p "require('./package.json').version")"

      - name: Bundle Desktop (Windows x64)
        run: pnpm bundle:desktop -- --os win --arch x64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ZCODE_ENV: production

      - name: List build artifacts
        run: |
          echo "=== Built Windows Artifacts ==="
          ls -lh packages/desktop/dist/

      - name: Upload Windows x64 Installer
        uses: actions/upload-artifact@v4
        with:
          name: zcode-windows-x64-artifacts
          path: packages/desktop/dist/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-linux-x64, build-mac-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "=== All Release Assets & Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('ZCode Desktop {0}', github.ref_name) || 'ZCode Desktop (Latest)' }}
          body: |
            Automated build of ZCode Desktop:
            - **Linux (x86_64)**: RPM, DEB, AppImage, Arch (.pkg.tar.zst)
            - **macOS (Apple Silicon)**: arm64 DMG
            - **Windows (x86_64)**: NSIS Setup .exe
          files: release-assets/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
