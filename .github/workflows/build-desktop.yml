name: Build Desktop & Release

on:
  # 在 package-standalone 分支上手动打版本 tag（vX.Y.Z）并推送即可触发；
  # 也可以在 Actions 页面手动运行，指定 release_tag / source_ref。
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to publish, e.g. v3.14.3'
        default: 'v3.14.3'
      source_ref:
        description: 'Source branch/commit/tag to build from (zai-org/ZCode)'
        default: 'main'

permissions:
  contents: write

# 版本 tag（v3.14.3 → 3.14.3）；手动触发时取 release_tag 输入。
# 三个构建 job 与发布 job 共用，避免各处硬编码。
env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
  RELEASE_VERSION: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag) || 'v0.0.0' }}

jobs:
  resolve-source:
    name: Resolve Source Commit
    # 构建源一律钉死到一个具体 commit：发布前把 main 同步到上游最新，
    # 三个平台构建同一 SHA，避免构建过程中上游更新导致产物不一致。
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve source SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${{ github.event_name == 'push' && 'main' || (inputs.source_ref || 'main') }}"
          sha="$(git ls-remote https://github.com/zai-org/ZCode.git "refs/heads/$ref" | cut -f1)"
          if [ -z "$sha" ]; then
            sha="$(git ls-remote https://github.com/zai-org/ZCode.git "refs/tags/$ref" | cut -f1)"
          fi
          [ -n "$sha" ] || { echo "Cannot resolve zai-org/ZCode ref: $ref" >&2; exit 1; }
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building from zai-org/ZCode@$sha ($ref)"

  build-linux-x64:
    name: Build Linux x86_64 Packages
    needs: resolve-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (zai-org/ZCode)
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils libarchive-tools zstd
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Bootstrap workspace
        run: pnpm bootstrap
        env:
          HUSKY: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Pin release version
        run: |
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.RELEASE_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "pinned package.json version to $(node -p "require('./package.json').version")"

      - name: Bundle Desktop (Linux x64)
        run: pnpm bundle:desktop -- --os linux --arch x64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ZCODE_ENV: production

      - name: List build artifacts
        run: |
          echo "=== Built Linux Artifacts ==="
          ls -lh packages/desktop/dist/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zcode-linux-x64-artifacts
          path: |
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.pkg.tar.zst
          if-no-files-found: error

  build-mac-arm64:
    name: Build macOS arm64 DMG
    needs: resolve-source
    runs-on: macos-14
    steps:
      - name: Checkout source (zai-org/ZCode)
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Bootstrap workspace
        run: pnpm bootstrap
        env:
          HUSKY: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Pin release version
        run: |
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.RELEASE_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "pinned package.json version to $(node -p "require('./package.json').version")"

      - name: Bundle Desktop (macOS arm64)
        run: pnpm bundle:desktop -- --os mac --arch arm64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ZCODE_ENV: production

      - name: List build artifacts
        run: |
          echo "=== Built macOS arm64 Artifacts ==="
          ls -lh packages/desktop/dist/

      - name: Upload macOS arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: zcode-mac-arm64-artifacts
          path: packages/desktop/dist/*.dmg
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64 Installer
    needs: resolve-source
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source (zai-org/ZCode)
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Bootstrap workspace
        run: pnpm bootstrap
        env:
          HUSKY: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Pin release version
        run: |
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.RELEASE_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "pinned package.json version to $(node -p "require('./package.json').version")"

      - name: Bundle Desktop (Windows x64)
        run: pnpm bundle:desktop -- --os win --arch x64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ZCODE_ENV: production

      - name: List build artifacts
        run: |
          echo "=== Built Windows Artifacts ==="
          ls -lh packages/desktop/dist/

      - name: Upload Windows x64 Installer
        uses: actions/upload-artifact@v4
        with:
          name: zcode-windows-x64-artifacts
          path: packages/desktop/dist/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-linux-x64, build-mac-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "=== All Release Assets & Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ZCode Desktop ${{ env.RELEASE_TAG }}
          body: |
            Automated build of ZCode Desktop ${{ env.RELEASE_TAG }}:
            - **Linux (x86_64)**: RPM, DEB, AppImage, Arch (.pkg.tar.zst)
            - **macOS (Apple Silicon)**: arm64 DMG
            - **Windows (x86_64)**: NSIS Setup .exe
          files: release-assets/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
