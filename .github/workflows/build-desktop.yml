name: Build Desktop & Release

on:
  # Primary path: manual dispatch (scripts/release.sh runs `gh workflow run`
  # after tagging main). Tag pushes only fire when the tagged commit itself
  # contains this file; tags cut on main (pure source snapshot) cannot
  # trigger workflows.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to publish, e.g. v3.14.3'
        default: 'v3.14.3'
      source_ref:
        description: 'Source branch/commit/tag to build from (douglarek/ZCode main = upstream backup)'
        default: 'main'

permissions:
  contents: write

# Version tag (v3.14.3 -> 3.14.3); taken from release_tag on manual runs.
# Shared by all build jobs and the publish job to avoid hardcoding.
env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
  RELEASE_VERSION: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag) || 'v0.0.0' }}

jobs:
  resolve-source:
    name: Resolve Source Commit
    # The build source is this repo's (douglarek/ZCode) main branch, which is
    # the backup of zai-org/ZCode; scripts/release.sh syncs it to upstream
    # before tagging. CI checks out that exact commit in its own directory so
    # all three platforms build the same SHA. Override via source_ref on
    # manual runs (default: main).
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve source SHA
        id: resolve
        run: |
          ref="${{ inputs.source_ref || 'main' }}"
          sha="$(git ls-remote https://github.com/douglarek/ZCode.git "refs/heads/$ref" | cut -f1)"
          if [ -z "$sha" ]; then
            sha="$(git ls-remote https://github.com/douglarek/ZCode.git "refs/tags/$ref" | cut -f1)"
          fi
          [ -n "$sha" ] || { echo "Cannot resolve douglarek/ZCode ref: $ref" >&2; exit 1; }
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building from douglarek/ZCode@$sha ($ref)"

  build-linux-x64:
    name: Build Linux x86_64 Packages
    needs: resolve-source
    runs-on: ubuntu-latest
    # One platform must not fail the workflow. Publish uses the artifact output.
    continue-on-error: true
    outputs:
      artifact: ${{ steps.result.outputs.artifact }}
    steps:
      - name: Checkout source (douglarek/ZCode main)
        uses: actions/checkout@v4
        with:
          repository: douglarek/ZCode
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils libarchive-tools zstd
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Fix web-share @zcode/shared alias
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const file = "packages/web-share/vite.config.ts";
          const text = readFileSync(file, "utf8");
          const pattern =
            /^([ \t]*)["']@zcode\/shared["']:\s*resolve\(REPO_ROOT,\s*["']packages\/shared\/src\/index\.ts["']\),?[ \t]*\r?\n/m;
          if (!pattern.test(text)) {
            const stillAliased = text.split("\n").some((line) => {
              const code = line.replace(/\/\/.*$/, "").trim();
              return /^["']@zcode\/shared["']\s*:/.test(code);
            });
            if (stillAliased) {
              console.error(`${file} still has an @zcode/shared alias this patch does not recognize`);
              process.exit(1);
            }
            console.log(`${file}: prefix alias already absent`);
            process.exit(0);
          }
          const next = text.replace(
            pattern,
            "$1// 去掉 @zcode/shared -> src/index.ts 前缀别名：子路径会被拼到 index.ts 后面（ENOTDIR）。\n$1// 入口和子路径都走 packages/shared/package.json exports。\n",
          );
          writeFileSync(file, next);
          console.log(`patched ${file}`);
          EOF

      - name: Bootstrap workspace
        run: pnpm bootstrap
        env:
          HUSKY: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Pin release version
        run: |
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.RELEASE_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "pinned package.json version to $(node -p "require('./package.json').version")"

      - name: Bundle Desktop (Linux x64)
        run: pnpm bundle:desktop -- --os linux --arch x64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ZCODE_ENV: production

      - name: List build artifacts
        run: |
          echo "=== Built Linux Artifacts ==="
          ls -lh packages/desktop/dist/

      - name: Upload Linux Artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: zcode-linux-x64-artifacts
          path: |
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.pkg.tar.zst
          if-no-files-found: error

      - name: Record artifact result
        id: result
        if: always()
        run: |
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "artifact=success" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=failure" >> "$GITHUB_OUTPUT"
          fi


  build-mac-arm64:
    name: Build macOS arm64 DMG
    needs: resolve-source
    runs-on: macos-14
    continue-on-error: true
    outputs:
      artifact: ${{ steps.result.outputs.artifact }}
    steps:
      - name: Checkout source (douglarek/ZCode main)
        uses: actions/checkout@v4
        with:
          repository: douglarek/ZCode
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Fix web-share @zcode/shared alias
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const file = "packages/web-share/vite.config.ts";
          const text = readFileSync(file, "utf8");
          const pattern =
            /^([ \t]*)["']@zcode\/shared["']:\s*resolve\(REPO_ROOT,\s*["']packages\/shared\/src\/index\.ts["']\),?[ \t]*\r?\n/m;
          if (!pattern.test(text)) {
            const stillAliased = text.split("\n").some((line) => {
              const code = line.replace(/\/\/.*$/, "").trim();
              return /^["']@zcode\/shared["']\s*:/.test(code);
            });
            if (stillAliased) {
              console.error(`${file} still has an @zcode/shared alias this patch does not recognize`);
              process.exit(1);
            }
            console.log(`${file}: prefix alias already absent`);
            process.exit(0);
          }
          const next = text.replace(
            pattern,
            "$1// 去掉 @zcode/shared -> src/index.ts 前缀别名：子路径会被拼到 index.ts 后面（ENOTDIR）。\n$1// 入口和子路径都走 packages/shared/package.json exports。\n",
          );
          writeFileSync(file, next);
          console.log(`patched ${file}`);
          EOF

      - name: Bootstrap workspace
        run: pnpm bootstrap
        env:
          HUSKY: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Pin release version
        run: |
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.RELEASE_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "pinned package.json version to $(node -p "require('./package.json').version")"

      - name: Bundle Desktop (macOS arm64)
        run: pnpm bundle:desktop -- --os mac --arch arm64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ZCODE_ENV: production

      - name: List build artifacts
        run: |
          echo "=== Built macOS arm64 Artifacts ==="
          ls -lh packages/desktop/dist/

      - name: Upload macOS arm64 DMG
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: zcode-mac-arm64-artifacts
          path: packages/desktop/dist/*.dmg
          if-no-files-found: error

      - name: Record artifact result
        id: result
        if: always()
        run: |
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "artifact=success" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=failure" >> "$GITHUB_OUTPUT"
          fi


  build-windows-x64:
    name: Build Windows x64 Installer
    needs: resolve-source
    runs-on: windows-latest
    continue-on-error: true
    outputs:
      artifact: ${{ steps.result.outputs.artifact }}
    defaults:
      run:
        shell: bash
    steps:
      # windows-latest sets core.autocrlf=true. That rewrites Gen UI vendor
      # *.min.js to CRLF and fails packages/desktop/scripts/gen-ui-runtime-assets.mjs
      # with "Gen UI vendor hash mismatch". .gitattributes only pins *.mjs and *.sh.
      - name: Keep LF line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout source (douglarek/ZCode main)
        uses: actions/checkout@v4
        with:
          repository: douglarek/ZCode
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0


      - name: Check Gen UI vendor line endings
        shell: bash
        run: |
          vendor="apps/zcode-cli/packages/visualize-plugin/skills/visualize/assets/vendor"
          if grep -q $'\r' "$vendor"/*; then
            echo "CRLF in Gen UI vendor files; sha256 check would fail" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Fix web-share @zcode/shared alias
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const file = "packages/web-share/vite.config.ts";
          const text = readFileSync(file, "utf8");
          const pattern =
            /^([ \t]*)["']@zcode\/shared["']:\s*resolve\(REPO_ROOT,\s*["']packages\/shared\/src\/index\.ts["']\),?[ \t]*\r?\n/m;
          if (!pattern.test(text)) {
            const stillAliased = text.split("\n").some((line) => {
              const code = line.replace(/\/\/.*$/, "").trim();
              return /^["']@zcode\/shared["']\s*:/.test(code);
            });
            if (stillAliased) {
              console.error(`${file} still has an @zcode/shared alias this patch does not recognize`);
              process.exit(1);
            }
            console.log(`${file}: prefix alias already absent`);
            process.exit(0);
          }
          const next = text.replace(
            pattern,
            "$1// 去掉 @zcode/shared -> src/index.ts 前缀别名：子路径会被拼到 index.ts 后面（ENOTDIR）。\n$1// 入口和子路径都走 packages/shared/package.json exports。\n",
          );
          writeFileSync(file, next);
          console.log(`patched ${file}`);
          EOF

      - name: Bootstrap workspace
        run: pnpm bootstrap
        env:
          HUSKY: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Pin release version
        run: |
          node -e "const fs=require('fs');const f='package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.env.RELEASE_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "pinned package.json version to $(node -p "require('./package.json').version")"

      - name: Bundle Desktop (Windows x64)
        run: pnpm bundle:desktop -- --os win --arch x64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ZCODE_ENV: production

      - name: List build artifacts
        run: |
          echo "=== Built Windows Artifacts ==="
          ls -lh packages/desktop/dist/

      - name: Upload Windows x64 Installer
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: zcode-windows-x64-artifacts
          path: packages/desktop/dist/*.exe
          if-no-files-found: error

      - name: Record artifact result
        id: result
        if: always()
        run: |
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "artifact=success" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=failure" >> "$GITHUB_OUTPUT"
          fi


  publish-release:
    name: Publish to GitHub Releases
    needs: [build-linux-x64, build-mac-arm64, build-windows-x64]
    if: >-
      always() &&
      !cancelled() &&
      (needs.build-linux-x64.outputs.artifact == 'success' ||
       needs.build-mac-arm64.outputs.artifact == 'success' ||
       needs.build-windows-x64.outputs.artifact == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          {
            echo "Automated build of ZCode Desktop ${RELEASE_TAG}."
            echo
            echo "Attached files are the platform packages that built successfully."
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../release-notes.md
          echo "=== All Release Assets & Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ZCode Desktop ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: release-assets/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # continue-on-error on the build jobs keeps a single platform failure from
  # failing the run. This job fails the run only when nothing was published.
  workflow-result:
    name: Workflow result
    needs: [build-linux-x64, build-mac-arm64, build-windows-x64, publish-release]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Fail only when no platform was published
        run: |
          linux="${{ needs.build-linux-x64.outputs.artifact }}"
          mac="${{ needs.build-mac-arm64.outputs.artifact }}"
          win="${{ needs.build-windows-x64.outputs.artifact }}"
          publish="${{ needs.publish-release.result }}"
          echo "linux=$linux mac=$mac windows=$win publish=$publish"
          ok=0
          [ "$linux" = success ] && ok=1
          [ "$mac" = success ] && ok=1
          [ "$win" = success ] && ok=1
          if [ "$ok" != 1 ]; then
            echo "Every platform build failed." >&2
            exit 1
          fi
          if [ "$publish" != success ]; then
            echo "At least one platform built, but publishing did not succeed." >&2
            exit 1
          fi
          echo "Published the platforms that built successfully."
